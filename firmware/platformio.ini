; Core2 food tracker — Milestone 1 (hardware proof of concept)
; Device:  pio run -e core2 -t upload      then   pio device monitor -e core2
; Tests:   pio test -e native              (needs a C++ compiler on the laptop; see docs/SETUP.md)

[platformio]
default_envs = core2

[env:core2]
platform = espressif32@^6.9.0
board = m5stack-core2
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Unified@^0.2.2
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<core/>
build_flags = -std=c++17
